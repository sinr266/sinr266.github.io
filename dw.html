<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>对位节奏练习</title>
  <style>
    :root{
      --bg:#0b0d12; --ink:#e9ecf3; --mut:#9aa3b6;
      --line:rgba(255,255,255,.10);
      --shadow:0 12px 40px rgba(0,0,0,.35);
      --accent:#3a65ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:radial-gradient(1200px 600px at 30% -20%, #141a2d 0%, var(--bg) 55%);
      color:var(--ink);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Microsoft YaHei",sans-serif;
    }
    .wrap{max-width:980px;margin:0 auto;padding:16px}

    .topbar{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:12px 12px;border:1px solid var(--line);border-radius:16px;
      background:linear-gradient(180deg,#121830,#0e1220);
      box-shadow:var(--shadow);
    }

    .homeLink{
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:32px;height:32px;
      background:#f0f0f0;
      border-radius:999px;
      transition:all .2s ease;
      border:1px solid rgba(0,0,0,.06);
    }
    .homeLink svg{width:18px;height:18px;fill:#666;transition:fill .2s ease}
    .homeLink:hover{background:#d32f2f}
    .homeLink:hover svg{fill:#fff}

    .pill{
      border:1px solid var(--line);border-radius:999px;padding:8px 12px;
      color:var(--mut);font-weight:900;background:linear-gradient(180deg,#10172b,#0d1220);
      white-space:nowrap;
    }
    .field{
      display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;
      background:linear-gradient(180deg,#10172b,#0d1220);
      color:var(--mut);font-weight:900;padding:6px 10px;
    }
    input[type="number"]{
      width:92px;
      background:#0a0f1c;border:1px solid rgba(255,255,255,.08);
      border-radius:12px;color:var(--ink);padding:8px 10px;outline:none;font-weight:850;
    }
    button{
      cursor:pointer;border:1px solid var(--line);
      background:linear-gradient(180deg,#1a2240,#11182c);
      color:var(--ink);border-radius:14px;font-weight:900;
      transition:transform .05s ease, border-color .15s ease;
      user-select:none;
      padding:10px 12px;
    }
    button:hover{border-color:#334469}
    button:active{transform:translateY(1px)}
    button.primary{
      border-color:rgba(58,101,255,.65);
      background:linear-gradient(180deg,#203a8d,#141f4f);
    }
    button.primary:hover{border-color:var(--accent)}
    button.icon{
      width:42px;height:42px;display:grid;place-items:center;padding:0;border-radius:14px;
    }
    button.icon svg{width:22px;height:22px;fill:currentColor}

    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr 64px 1fr;
      gap:12px;
      align-items:stretch;
    }
    @media (max-width: 820px){
      .grid{grid-template-columns: 1fr; }
      .swapCol{order:3; display:flex; justify-content:center;}
    }
    .col{
      border:1px solid var(--line);border-radius:16px;
      background:linear-gradient(180deg,#121830,#0e1220);
      box-shadow:var(--shadow);
      padding:14px;
      min-height:240px;
      position:relative;
      overflow:hidden;
    }
    .col h3{margin:0 0 10px 0; font-size:16px; letter-spacing:.5px}
    .subRow{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
    .subBtns{display:flex; gap:8px; align-items:center}
    .mini{
      width:42px;height:42px; padding:0;
      display:grid;place-items:center;
      font-size:18px; font-weight:1000;
    }
    .subVal{
      font-size:26px; font-weight:1000;
      padding:6px 12px; border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      min-width:64px; text-align:center;
    }

    /* 视觉提示（可选，不影响核心） */
    .track{
      margin-top:14px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:linear-gradient(180deg,#0b1020,#070a12);
      padding:12px;
    }
    .cells{
      display:grid;
      grid-template-columns: repeat(8, 1fr);
      gap:8px;
      align-items:center;
    }
    .cell{
      height:34px;border-radius:12px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      display:grid;place-items:center;
      color:rgba(233,236,243,.75);
      font-weight:950;
      transition:transform .08s ease, background .12s ease, border-color .12s ease;
    }
    .cell.off{ opacity:.25; filter:saturate(.6); }
    .cell.hit{
      border-color:rgba(58,101,255,.65);
      background:rgba(58,101,255,.22);
      transform:translateY(-1px);
      opacity:1;
    }
    .swapCol{display:grid; place-items:center;}

    /* 细分图形提示区 */
    .shapeBar{
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:16px;
      background:linear-gradient(180deg,#10172b,#0d1220);
      box-shadow:var(--shadow);
      padding:12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      align-items:center;
    }
    .shapeCard{
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:rgba(255,255,255,.02);
      padding:10px 12px;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .shapeCard .lab{color:var(--mut);font-weight:950;white-space:nowrap}
    .shapeWrap{
      margin-left:auto;
      width:68px;height:68px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg,#0b1020,#070a12);
      display:grid;place-items:center;
      overflow:hidden;
    }
    .shapeWrap svg{width:64px;height:64px}
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <a class="homeLink" href="index.html" aria-label="返回首页" title="返回首页">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/>
      </svg>
    </a>

    <span class="pill">节奏对位</span>

    <div class="field" title="BPM 15–100">
      BPM
      <input id="bpm" type="number" min="15" max="100" value="25" />
    </div>

    <button class="primary" id="playBtn"><span id="playTxt">播放</span></button>
    <button id="resetBtn">复位</button>

    <span class="pill" id="state">就绪</span>
  </div>

  <div class="grid">
    <!-- Left -->
    <div class="col" id="leftCol">
      <h3>左（L）</h3>

      <div class="subRow">
        <span class="pill">细分</span>
        <div class="subBtns">
          <button class="mini" id="lMinus">−</button>
          <div class="subVal" id="lSubVal">4</div>
          <button class="mini" id="lPlus">+</button>
        </div>

        <div class="field" title="左音色频率（Hz）">
          Hz <input id="lHz" type="number" min="80" max="8000" value="1800" />
        </div>
      </div>

      <div class="track" title="左列视觉提示（不影响核心对位精度）">
        <div class="cells" id="lCells"></div>
      </div>
    </div>

    <!-- Swap -->
    <div class="swapCol">
      <button class="icon" id="swapBtn" title="互换左右（仅互换细分，不互换音色）" aria-label="互换左右">
        <svg viewBox="0 0 24 24">
          <path d="M7 7h11l-2-2 1.4-1.4L22.8 9l-5.4 5.4L16 13l2-2H7V7zm10 10H6l2 2-1.4 1.4L1.2 15l5.4-5.4L8 11l-2 2h11v4z"/>
        </svg>
      </button>
    </div>

    <!-- Right -->
    <div class="col" id="rightCol">
      <h3>右（R）</h3>

      <div class="subRow">
        <span class="pill">细分</span>
        <div class="subBtns">
          <button class="mini" id="rMinus">−</button>
          <div class="subVal" id="rSubVal">3</div>
          <button class="mini" id="rPlus">+</button>
        </div>

        <div class="field" title="右音色频率（Hz）">
          Hz <input id="rHz" type="number" min="80" max="8000" value="1100" />
        </div>
      </div>

      <div class="track" title="右列视觉提示（不影响核心对位精度）">
        <div class="cells" id="rCells"></div>
      </div>
    </div>
  </div>

  <!-- ✅ 细分图形提示：几细分 = 几边形（1=点，2=横线） -->
  <div class="shapeBar">
    <div class="shapeCard">
      <div class="lab"></div>
      <span class="pill" id="lShapeTxt">4</span>
      <div class="shapeWrap" id="lShape"></div>
    </div>
    <div class="shapeCard">
      <div class="lab"></div>
      <span class="pill" id="rShapeTxt">3</span>
      <div class="shapeWrap" id="rShape"></div>
    </div>
  </div>
</div>

<script>
(() => {
  // ===== constants =====
  const BPM_MIN=15, BPM_MAX=100;
  const SUB_MIN=1, SUB_MAX=8;

  // 调度：用 WebAudio 绝对时间排程，保证“先对齐 Beat，再平均细分”
  const LOOKAHEAD=0.12;   // seconds
  const TICK=0.016;       // seconds

  // ===== elements =====
  const bpmInp = document.getElementById('bpm');
  const playBtn = document.getElementById('playBtn');
  const playTxt = document.getElementById('playTxt');
  const resetBtn = document.getElementById('resetBtn');
  const stateEl = document.getElementById('state');

  const lMinus=document.getElementById('lMinus');
  const lPlus=document.getElementById('lPlus');
  const lSubVal=document.getElementById('lSubVal');
  const lHz=document.getElementById('lHz');
  const lCells=document.getElementById('lCells');

  const rMinus=document.getElementById('rMinus');
  const rPlus=document.getElementById('rPlus');
  const rSubVal=document.getElementById('rSubVal');
  const rHz=document.getElementById('rHz');
  const rCells=document.getElementById('rCells');

  const swapBtn=document.getElementById('swapBtn');

  // 形状提示
  const lShape=document.getElementById('lShape');
  const rShape=document.getElementById('rShape');
  const lShapeTxt=document.getElementById('lShapeTxt');
  const rShapeTxt=document.getElementById('rShapeTxt');

  // ===== state =====
  let L = { sub: 4 };
  let R = { sub: 3 };

  let running=false;
  let timer=null;

  // Audio
  let audio=null;
  let gOut=null;

  // ===== helpers =====
  const clampInt=(v,lo,hi)=>Math.max(lo,Math.min(hi, (v|0)));
  const clampNum=(v,lo,hi)=>Math.max(lo,Math.min(hi, +v));
  const getBpm=()=>clampNum(bpmInp.value, BPM_MIN, BPM_MAX);
  const beatSec=()=>60/getBpm();

  function ensureAudio(){
    if(audio) return;
    audio = new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
    gOut = audio.createGain();
    gOut.gain.value = 0.9;
    gOut.connect(audio.destination);
  }

  // 短 click（正弦 + 快速衰减）
  function clickAt(t, freq, gain=0.6, ms=18){
    if(!audio) return;
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (ms/1000));

    osc.connect(g).connect(gOut);
    osc.start(t);
    osc.stop(t + (ms/1000) + 0.02);
  }

  function setState(txt){ stateEl.textContent = txt; }

  // ===== UI (视觉提示) =====
  function buildCells(container){
    container.innerHTML="";
    for(let i=0;i<8;i++){
      const d=document.createElement('div');
      d.className='cell';
      d.textContent = (i+1);
      container.appendChild(d);
    }
  }

  function flashCell(side, idx){
    const cells = (side==="L") ? lCells.children : rCells.children;
    if(idx>=0 && idx<cells.length){
      const el=cells[idx];
      el.classList.add('hit');
      setTimeout(()=>el.classList.remove('hit'), 80);
    }
  }

  // ===== 形状绘制：几细分=几边形（1=点，2=横线） =====
  function svgEl(tag, attrs={}){
    const el=document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k, String(v));
    return el;
  }

  function polygonPoints(n, cx, cy, r, rot=-Math.PI/2){
    const pts=[];
    for(let i=0;i<n;i++){
      const a = rot + i*(2*Math.PI/n);
      pts.push(`${(cx + r*Math.cos(a)).toFixed(2)},${(cy + r*Math.sin(a)).toFixed(2)}`);
    }
    return pts.join(" ");
  }

  function drawShape(container, n){
    container.innerHTML="";
    const svg = svgEl("svg", {viewBox:"0 0 64 64", width:"64", height:"64"});
    // 轻微发光底
    const glow = svgEl("circle", {cx:"32", cy:"32", r:"22", fill:"rgba(58,101,255,0.08)"});
    svg.appendChild(glow);

    if(n<=1){
      // 1：小圆点
      svg.appendChild(svgEl("circle", {
        cx:"32", cy:"32", r:"4.5",
        fill:"#e9ecf3", opacity:"0.9"
      }));
    }else if(n===2){
      // 2：横线（圆角）
      svg.appendChild(svgEl("rect", {
        x:"14", y:"30", width:"36", height:"4.8", rx:"2.4",
        fill:"#e9ecf3", opacity:"0.9"
      }));
    }else{
      // 3+：正多边形（描边）
      const pts = polygonPoints(n, 32, 32, 18);
      svg.appendChild(svgEl("polygon", {
        points: pts,
        fill:"rgba(233,236,243,0.10)",
        stroke:"#e9ecf3",
        "stroke-width":"2.5",
        "stroke-linejoin":"round",
        opacity:"0.95"
      }));
      // 小中心点增强识别
      svg.appendChild(svgEl("circle", {cx:"32", cy:"32", r:"2.6", fill:"#e9ecf3", opacity:"0.75"}));
    }

    container.appendChild(svg);
  }

  function refreshCellsAndShapes(){
    [...lCells.children].forEach((c,i)=> c.classList.toggle('off', i>=L.sub));
    [...rCells.children].forEach((c,i)=> c.classList.toggle('off', i>=R.sub));
    lSubVal.textContent = L.sub;
    rSubVal.textContent = R.sub;

    lShapeTxt.textContent = String(L.sub);
    rShapeTxt.textContent = String(R.sub);
    drawShape(lShape, L.sub);
    drawShape(rShape, R.sub);
  }

  // ===== transport =====
  function start(){
    ensureAudio();
    audio.resume?.();

    if(running) return;
    running=true;
    playTxt.textContent="暂停";
    setState("播放");

    // “优先对好 beat”：每拍从 beatStartT 开始，两边都从 step=0 同时起
    const now = audio.currentTime;
    scheduler.beatStartT = now + 0.06;
    scheduler.lStep = 0;
    scheduler.rStep = 0;

    if(timer) clearInterval(timer);
    timer = setInterval(scheduler, TICK*1000);
  }

  function pause(){
    if(!running) return;
    running=false;
    playTxt.textContent="播放";
    setState("暂停");
    if(timer){ clearInterval(timer); timer=null; }
  }

  function reset(){
    pause();
    delete scheduler.beatStartT;
    delete scheduler.lStep;
    delete scheduler.rStep;
    setState("就绪");
  }

  // ✅ 核心：严格对位（先对齐 Beat，再平均细分）
  function scheduler(){
    if(!running || !audio) return;

    const now = audio.currentTime;
    const T = beatSec();

    if(typeof scheduler.beatStartT === "undefined"){
      scheduler.beatStartT = now + 0.06;
      scheduler.lStep = 0;
      scheduler.rStep = 0;
    }

    while(true){
      const lSub = L.sub;
      const rSub = R.sub;

      const lNext = scheduler.beatStartT + scheduler.lStep * (T / lSub);
      const rNext = scheduler.beatStartT + scheduler.rStep * (T / rSub);

      const tNext = Math.min(lNext, rNext);
      if(tNext >= now + LOOKAHEAD) break;

      const eps = 1e-6;
      const hitL = Math.abs(tNext - lNext) < eps;
      const hitR = Math.abs(tNext - rNext) < eps;

      const curL = hitL ? scheduler.lStep : null;
      const curR = hitR ? scheduler.rStep : null;

      if(hitL){
        clickAt(tNext, clampNum(lHz.value,80,8000), 0.60, 18);
        scheduler.lStep++;
      }
      if(hitR){
        clickAt(tNext, clampNum(rHz.value,80,8000), 0.45, 16);
        scheduler.rStep++;
      }

      // 视觉闪烁（可选）
      const dt = Math.max(0, (tNext - now));
      setTimeout(() => {
        if(hitL) flashCell("L", curL);
        if(hitR) flashCell("R", curR);
      }, dt * 1000);

      // 一拍结束：左右都走完 -> 下一拍（再次保证拍头对齐）
      if(scheduler.lStep >= lSub && scheduler.rStep >= rSub){
        scheduler.beatStartT += T;
        scheduler.lStep = 0;
        scheduler.rStep = 0;
      }
    }
  }

  // ===== controls =====
  function realignNextBeat(){
    // 改参数时：从“下一拍拍头”重新对齐，逻辑更清晰
    if(running && audio){
      const now = audio.currentTime;
      scheduler.beatStartT = now + 0.08;
      scheduler.lStep = 0;
      scheduler.rStep = 0;
    }
  }

  function setSub(side, v){
    v = clampInt(v, SUB_MIN, SUB_MAX);
    if(side==="L") L.sub=v;
    else R.sub=v;

    refreshCellsAndShapes();
    realignNextBeat();
  }

  lMinus.onclick=()=> setSub("L", L.sub-1);
  lPlus.onclick =()=> setSub("L", L.sub+1);
  rMinus.onclick=()=> setSub("R", R.sub-1);
  rPlus.onclick =()=> setSub("R", R.sub+1);

  bpmInp.onchange=()=>{
    bpmInp.value = clampInt(bpmInp.value, BPM_MIN, BPM_MAX);
    realignNextBeat();
  };

  // ✅ 互换：只交换细分（音色Hz保持左右不变）
  swapBtn.onclick=()=>{
    const tmpSub = L.sub; L.sub = R.sub; R.sub = tmpSub;
    L.sub = clampInt(L.sub, SUB_MIN, SUB_MAX);
    R.sub = clampInt(R.sub, SUB_MIN, SUB_MAX);
    refreshCellsAndShapes();
    realignNextBeat();
  };

  playBtn.onclick=()=>{ running ? pause() : start(); };
  resetBtn.onclick=reset;

  // ===== init =====
  function init(){
    buildCells(lCells);
    buildCells(rCells);

    L.sub = 4;
    R.sub = 3;

    refreshCellsAndShapes();
    setState("就绪");
  }
  init();
})();
</script>
</body>
</html>
