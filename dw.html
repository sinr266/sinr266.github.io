<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>对位节奏练习</title>
  <style>
    :root{
      --bg:#0b0d12; --ink:#e9ecf3; --mut:#9aa3b6;
      --line:rgba(255,255,255,.10);
      --shadow:0 12px 40px rgba(0,0,0,.35);
      --accent:#3a65ff;
      --left-color:#3a65ff; /* 左圆指针颜色 */
      --right-color:#ff6b6b; /* 右圆指针颜色 */
      --pulse-color:#ffcc00; /* 转动的黄色点 */
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:radial-gradient(1200px 600px at 30% -20%, #141a2d 0%, var(--bg) 55%);
      color:var(--ink);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Microsoft YaHei",sans-serif;
    }
    .wrap{max-width:980px;margin:0 auto;padding:16px}

    .topbar{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:12px 12px;border:1px solid var(--line);border-radius:16px;
      background:linear-gradient(180deg,#121830,#0e1220);
      box-shadow:var(--shadow);
    }

    .homeLink{
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:32px;height:32px;
      background:#f0f0f0;
      border-radius:999px;
      transition:all .2s ease;
      border:1px solid rgba(0,0,0,.06);
    }
    .homeLink svg{width:18px;height:18px;fill:#666;transition:fill .2s ease}
    .homeLink:hover{background:#d32f2f}
    .homeLink:hover svg{fill:#fff}

    .pill{
      border:1px solid var(--line);border-radius:999px;padding:8px 12px;
      color:var(--mut);font-weight:900;background:linear-gradient(180deg,#10172b,#0d1220);
      white-space:nowrap;
    }
    .field{
      display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;
      background:linear-gradient(180deg,#10172b,#0d1220);
      color:var(--mut);font-weight:900;padding:0px 6px;
    }
    input[type="number"]{
      width:92px;
      background:#0a0f1c;border:1px solid rgba(255,255,255,.08);
      border-radius:12px;color:var(--ink);padding:8px 10px;outline:none;font-weight:850;
    }
    button{
      cursor:pointer;border:1px solid var(--line);
      background:linear-gradient(180deg,#1a2240,#11182c);
      color:var(--ink);border-radius:14px;font-weight:900;
      transition:transform .05s ease, border-color .15s ease;
      user-select:none;
      padding:10px 12px;
    }
    button:hover{border-color:#334469}
    button:active{transform:translateY(1px)}
    button.primary{
      border-color:rgba(58,101,255,.65);
      background:linear-gradient(180deg,#203a8d,#141f4f);
    }
    button.primary:hover{border-color:var(--accent)}
    button.icon{
      width:42px;height:42px;display:grid;place-items:center;padding:0;border-radius:14px;
    }
    button.icon svg{width:22px;height:22px;fill:currentColor}

    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr 64px 1fr;
      gap:12px;
      align-items:stretch;
    }
    @media (max-width: 820px){
      .grid{grid-template-columns: 1fr; }
      .swapCol{order:3; display:flex; justify-content:center;}
    }
    .col{
      border:1px solid var(--line);border-radius:16px;
      background:linear-gradient(180deg,#121830,#0e1220);
      box-shadow:var(--shadow);
      padding:14px;
      min-height:240px;
      position:relative;
      overflow:hidden;
    }
    .col h3{
      margin:0 0 14px 0;
      font-size:16px;
      letter-spacing:.5px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .col h3::before{
      content:"";
      width:12px;
      height:12px;
      border-radius:50%;
      display:inline-block;
    }
    #leftCol h3::before{background:var(--left-color)}
    #rightCol h3::before{background:var(--right-color)}
    
    .subRow{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
    .subBtns{display:flex; gap:8px; align-items:center}
    .mini{
      width:28px;height:28px; padding:0;
      display:grid;place-items:center;
      font-size:18px; font-weight:1000;
    }
    .subVal{
      font-size:14px; font-weight:1000;
      padding:6px 12px; border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      min-width:64px; text-align:center;
    }

    /* 时钟圆盘区域 */
    .clockContainer{
      margin-top:16px;
      display:flex;
      justify-content:center;
      align-items:center;
      height:200px;
    }
    .clock{
      width:160px;
      height:160px;
      position:relative;
    }
    .clockBase{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      border:1.5px solid rgba(255,255,255,0.15);
      background:rgba(0,0,0,0.1);
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .centerNumber{
      font-size:32px;
      font-weight:900;
      color:var(--ink);
      text-shadow:0 2px 8px rgba(0,0,0,0.5);
      opacity:0.85;
      transition:all 0.15s ease;
    }
    .centerNumber.playing{
      transform:scale(1.1);
      color:currentColor;
    }
    .clockDot{
      position:absolute;
      width:14px;
      height:14px;
      border-radius:50%;
      background:rgba(255,255,255,0.2);
      transform:translate(-50%, -50%);
      transition:all 0.15s ease;
      border:2px solid rgba(255,255,255,0.4);
    }
    .clockDot.active{
      background:currentColor;
      border-color:currentColor;
      box-shadow:0 0 8px currentColor;
    }
    .clockHand{
      position:absolute;
      width:22px;
      height:22px;
      border-radius:50%;
      background:currentColor;
      transform:translate(-50%, -50%);
      transition:transform 0.08s linear;
      z-index:10;
      box-shadow:0 0 12px currentColor;
    }
    /* 转动的黄色点 */
    .pulseDot{
      position:absolute;
      width:16px;
      height:16px;
      border-radius:50%;
      background:var(--pulse-color);
      transform:translate(-50%, -50%);
      z-index:5;
      box-shadow:0 0 10px var(--pulse-color);
      opacity:0.9;
    }
    
    .swapCol{display:grid; place-items:center;}
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <a class="homeLink" href="index.html" aria-label="返回首页" title="返回首页">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/>
      </svg>
    </a>

    <span class="pill">节奏对位</span>

    <div class="field" title="BPM 15–100">
      BPM
      <input id="bpm" type="number" min="15" max="100" value="25" />
    </div>

    <button class="primary" id="playBtn"><span id="playTxt">播放</span></button>
    <button id="resetBtn">复位</button>

    <span class="pill" id="state">就绪</span>
  </div>

  <div class="grid">
    <!-- Left -->
    <div class="col" id="leftCol">
      <h3>左（L）</h3>

      <div class="subRow">
        <div class="subBtns">
          <button class="mini" id="lMinus">−</button>
          <div class="subVal" id="lSubVal">4</div>
          <button class="mini" id="lPlus">+</button>
        </div>

        <div class="field" title="左音色频率（Hz）">
          Hz <input id="lHz" type="number" min="80" max="8000" value="1800" />
        </div>
      </div>

      <div class="clockContainer">
        <div class="clock" id="lClock">
          <div class="clockBase">
            <div class="centerNumber" id="lCenterNumber" style="color:var(--left-color)">1</div>
          </div>
          <div class="clockHand" style="color:var(--left-color)"></div>
          <div class="pulseDot"></div>
        </div>
      </div>
    </div>

    <!-- Swap -->
    <div class="swapCol">
      <button class="icon" id="swapBtn" title="互换左右（仅互换细分，不互换音色）" aria-label="互换左右">
        <svg viewBox="0 0 24 24">
          <path d="M7 7h11l-2-2 1.4-1.4L22.8 9l-5.4 5.4L16 13l2-2H7V7zm10 10H6l2 2-1.4 1.4L1.2 15l5.4-5.4L8 11l-2 2h11v4z"/>
        </svg>
      </button>
    </div>

    <!-- Right -->
    <div class="col" id="rightCol">
      <h3>右（R）</h3>
      <div class="subRow">
        <div class="subBtns">
          <button class="mini" id="rMinus">−</button>
          <div class="subVal" id="rSubVal">3</div>
          <button class="mini" id="rPlus">+</button>
        </div>

        <div class="field" title="右音色频率（Hz）">
          Hz <input id="rHz" type="number" min="80" max="8000" value="1100" />
        </div>
      </div>

      <div class="clockContainer">
        <div class="clock" id="rClock">
          <div class="clockBase">
            <div class="centerNumber" id="rCenterNumber" style="color:var(--right-color)">1</div>
          </div>
          <div class="clockHand" style="color:var(--right-color)"></div>
          <div class="pulseDot"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ===== constants =====
  const BPM_MIN=15, BPM_MAX=100;
  const SUB_MIN=1, SUB_MAX=8;

  // 调度：用 WebAudio 绝对时间排程，保证"先对齐 Beat，再平均细分"
  const LOOKAHEAD=0.12;   // seconds
  const TICK=0.016;       // seconds

  // ===== elements =====
  const bpmInp = document.getElementById('bpm');
  const playBtn = document.getElementById('playBtn');
  const playTxt = document.getElementById('playTxt');
  const resetBtn = document.getElementById('resetBtn');
  const stateEl = document.getElementById('state');

  const lMinus=document.getElementById('lMinus');
  const lPlus=document.getElementById('lPlus');
  const lSubVal=document.getElementById('lSubVal');
  const lHz=document.getElementById('lHz');
  const lClock=document.getElementById('lClock');
  const lCenterNumber=document.getElementById('lCenterNumber');

  const rMinus=document.getElementById('rMinus');
  const rPlus=document.getElementById('rPlus');
  const rSubVal=document.getElementById('rSubVal');
  const rHz=document.getElementById('rHz');
  const rClock=document.getElementById('rClock');
  const rCenterNumber=document.getElementById('rCenterNumber');

  const swapBtn=document.getElementById('swapBtn');

  // ===== state =====
  let L = { sub: 4, currentStep: 0 };
  let R = { sub: 3, currentStep: 0 };
  
  let lastBeatTime = 0;

  let running=false;
  let timer=null;

  // Audio
  let audio=null;
  let gOut=null;

  // ===== helpers =====
  const clampInt=(v,lo,hi)=>Math.max(lo,Math.min(hi, (v|0)));
  const clampNum=(v,lo,hi)=>Math.max(lo,Math.min(hi, +v));
  const getBpm=()=>clampNum(bpmInp.value, BPM_MIN, BPM_MAX);
  const beatSec=()=>60/getBpm();

  function ensureAudio(){
    if(audio) return;
    audio = new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
    gOut = audio.createGain();
    gOut.gain.value = 0.9;
    gOut.connect(audio.destination);
  }

  // 短 click（正弦 + 快速衰减）
  function clickAt(t, freq, gain=0.6, ms=18){
    if(!audio) return;
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (ms/1000));

    osc.connect(g).connect(gOut);
    osc.start(t);
    osc.stop(t + (ms/1000) + 0.02);
  }

  function setState(txt){ stateEl.textContent = txt; }

  // ===== 时钟圆盘绘制 =====
  function drawClock(container, subCount, side){
    // 清空容器
    container.querySelectorAll('.clockDot').forEach(dot => dot.remove());
    
    // 创建细分点 - 直接在圆边框上
    for(let i = 0; i < subCount; i++){
      const angle = (i * 2 * Math.PI) / subCount - Math.PI/2; // 从顶部开始
      const radius = 50; // 半径设为50%，让点在边框上
      const x = 50 + radius * Math.cos(angle);
      const y = 50 + radius * Math.sin(angle);
      
      const dot = document.createElement('div');
      dot.className = 'clockDot';
      dot.style.left = `${x}%`;
      dot.style.top = `${y}%`;
      dot.style.color = side === 'L' ? 'var(--left-color)' : 'var(--right-color)';
      container.appendChild(dot);
    }
  }

  function updateClockDisplay(container, centerNumber, currentStep, total, side){
    const hand = container.querySelector('.clockHand');
    if(!hand || total === 0) return;
    
    // 更新中心数字：显示当前播放的细分编号（从1开始）
    const displayNumber = (currentStep % total) + 1; // 确保在1-total范围内
    centerNumber.textContent = displayNumber;
    centerNumber.style.color = side === 'L' ? 'var(--left-color)' : 'var(--right-color)';
    
    // 短暂放大效果
    centerNumber.classList.add('playing');
    setTimeout(() => centerNumber.classList.remove('playing'), 150);
    
    // 更新指针位置
    const stepInCurrentBeat = currentStep % total;
    const angle = stepInCurrentBeat * (2 * Math.PI / total) - Math.PI/2;
    const radius = 50;
    const x = 50 + radius * Math.cos(angle);
    const y = 50 + radius * Math.sin(angle);
    
    hand.style.left = `${x}%`;
    hand.style.top = `${y}%`;
    
    // 更新点的激活状态
    updateDotsActiveState(container, stepInCurrentBeat, total, side);
  }

  // 更新黄色转动的点（在圆圈线上，一拍转一圈）
  function updatePulseDot(container, side){
    const pulse = container.querySelector('.pulseDot');
    if(!pulse || !running) return;
    
    // 黄色点角度：根据当前拍内时间计算，一拍转一圈
    const timeSinceBeat = audio.currentTime - lastBeatTime;
    const T = beatSec();
    const pulseAngle = (timeSinceBeat / T) * 2 * Math.PI - Math.PI/2;
    const radius = 50; // 在圆圈线上
    const x = 50 + radius * Math.cos(pulseAngle);
    const y = 50 + radius * Math.sin(pulseAngle);
    
    pulse.style.left = `${x}%`;
    pulse.style.top = `${y}%`;
  }

  // 更新点的激活状态
  function updateDotsActiveState(container, currentStep, total, side){
    const dots = container.querySelectorAll('.clockDot');
    dots.forEach((dot, index) => {
      if(index === currentStep) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });
  }

  function refreshClocks(){
    // 更新数字显示
    lSubVal.textContent = L.sub;
    rSubVal.textContent = R.sub;
    
    // 绘制时钟
    drawClock(lClock, L.sub, 'L');
    drawClock(rClock, R.sub, 'R');
    
    // 初始化显示
    updateClockDisplay(lClock, lCenterNumber, 0, L.sub, 'L');
    updateClockDisplay(rClock, rCenterNumber, 0, R.sub, 'R');
  }

  // ===== transport =====
  function start(){
    ensureAudio();
    audio.resume?.();

    if(running) return;
    running=true;
    playTxt.textContent="暂停";
    setState("播放");
    
    const now = audio.currentTime;
    
    // 重置状态
    L.currentStep = 0;
    R.currentStep = 0;
    
    // 设置第一拍的开始时间
    scheduler.beatStartT = now + 0.06;
    scheduler.lNextIndex = 0;  // 左侧下一个要触发的细分索引
    scheduler.rNextIndex = 0;  // 右侧下一个要触发的细分索引
    scheduler.lLastShownStep = 0; // 左侧最后显示的细分
    scheduler.rLastShownStep = 0; // 右侧最后显示的细分
    lastBeatTime = scheduler.beatStartT;

    // 初始显示
    updateClockDisplay(lClock, lCenterNumber, 0, L.sub, 'L');
    updateClockDisplay(rClock, rCenterNumber, 0, R.sub, 'R');

    if(timer) clearInterval(timer);
    timer = setInterval(scheduler, TICK*1000);
  }

  function pause(){
    if(!running) return;
    running=false;
    playTxt.textContent="播放";
    setState("暂停");
    
    if(timer){ clearInterval(timer); timer=null; }
  }

  function reset(){
    pause();
    delete scheduler.beatStartT;
    delete scheduler.lNextIndex;
    delete scheduler.rNextIndex;
    delete scheduler.lLastShownStep;
    delete scheduler.rLastShownStep;
    
    L.currentStep = 0;
    R.currentStep = 0;
    
    setState("就绪");
    
    // 重置显示到起始位置
    updateClockDisplay(lClock, lCenterNumber, 0, L.sub, 'L');
    updateClockDisplay(rClock, rCenterNumber, 0, R.sub, 'R');
  }

  // ✅ 修正的核心逻辑
  function scheduler(){
    if(!running || !audio) return;

    const now = audio.currentTime;
    const T = beatSec();

    // 更新黄色点位置
    updatePulseDot(lClock, 'L');
    updatePulseDot(rClock, 'R');

    // 检查是否需要开始新的一拍
    if(typeof scheduler.beatStartT !== "undefined" && now >= scheduler.beatStartT + T) {
      // 开始新的一拍
      scheduler.beatStartT += T;
      scheduler.lNextIndex = 0;
      scheduler.rNextIndex = 0;
      lastBeatTime = scheduler.beatStartT;
      
      // 重置显示为第一细分
      scheduler.lLastShownStep = 0;
      scheduler.rLastShownStep = 0;
      updateClockDisplay(lClock, lCenterNumber, 0, L.sub, 'L');
      updateClockDisplay(rClock, rCenterNumber, 0, R.sub, 'R');
    }

    while(true){
      // 计算左右两侧的下一次触发时间
      const lNextTime = scheduler.beatStartT + scheduler.lNextIndex * (T / L.sub);
      const rNextTime = scheduler.beatStartT + scheduler.rNextIndex * (T / R.sub);
      
      // 取更早的时间
      const nextTime = Math.min(lNextTime, rNextTime);
      
      // 如果时间太晚，跳出循环
      if(nextTime >= now + LOOKAHEAD) break;
      
      const eps = 1e-6;
      const hitL = Math.abs(nextTime - lNextTime) < eps;
      const hitR = Math.abs(nextTime - rNextTime) < eps;
      
      if(hitL){
        // 左侧触发
        // 当前显示的步骤应该是 lNextIndex
        const displayStep = scheduler.lNextIndex;
        scheduler.lLastShownStep = displayStep;
        
        // 更新L的当前步骤（用于数字显示）
        L.currentStep = displayStep;
        
        // 先更新视觉
        updateClockDisplay(lClock, lCenterNumber, displayStep, L.sub, 'L');
        
        // 播放声音
        clickAt(nextTime, clampNum(lHz.value,80,8000), 0.60, 18);
        
        // 递增索引用于计算下一个触发
        scheduler.lNextIndex++;
        
        // 如果左侧已经完成一拍的所有细分，等待右侧完成
        if(scheduler.lNextIndex >= L.sub) {
          // 左侧等待，不重置，直到一拍完全结束
        }
      }
      
      if(hitR){
        // 右侧触发
        const displayStep = scheduler.rNextIndex;
        scheduler.rLastShownStep = displayStep;
        
        R.currentStep = displayStep;
        updateClockDisplay(rClock, rCenterNumber, displayStep, R.sub, 'R');
        clickAt(nextTime, clampNum(rHz.value,80,8000), 0.45, 16);
        scheduler.rNextIndex++;
        
        if(scheduler.rNextIndex >= R.sub) {
          // 右侧等待
        }
      }
    }
  }

  // ===== controls =====
  function realignNextBeat(){
    if(running && audio){
      const now = audio.currentTime;
      scheduler.beatStartT = now + 0.08;
      scheduler.lNextIndex = 0;
      scheduler.rNextIndex = 0;
      scheduler.lLastShownStep = 0;
      scheduler.rLastShownStep = 0;
      lastBeatTime = scheduler.beatStartT;
      
      L.currentStep = 0;
      R.currentStep = 0;
      
      // 立即更新显示
      updateClockDisplay(lClock, lCenterNumber, 0, L.sub, 'L');
      updateClockDisplay(rClock, rCenterNumber, 0, R.sub, 'R');
    }
  }

  function setSub(side, v){
    v = clampInt(v, SUB_MIN, SUB_MAX);
    if(side==="L") L.sub=v;
    else R.sub=v;

    // 如果当前步骤超过新细分，重置为0
    if(L.currentStep >= L.sub) L.currentStep = 0;
    if(R.currentStep >= R.sub) R.currentStep = 0;
    
    refreshClocks();
    realignNextBeat();
  }

  lMinus.onclick=()=> setSub("L", L.sub-1);
  lPlus.onclick =()=> setSub("L", L.sub+1);
  rMinus.onclick=()=> setSub("R", R.sub-1);
  rPlus.onclick =()=> setSub("R", R.sub+1);

  bpmInp.onchange=()=>{
    bpmInp.value = clampInt(bpmInp.value, BPM_MIN, BPM_MAX);
    realignNextBeat();
  };

  // ✅ 互换：只交换细分
  swapBtn.onclick=()=>{
    const tmpSub = L.sub; L.sub = R.sub; R.sub = tmpSub;
    L.sub = clampInt(L.sub, SUB_MIN, SUB_MAX);
    R.sub = clampInt(R.sub, SUB_MIN, SUB_MAX);
    
    // 交换当前步骤，但要确保不超过细分范围
    const tmpStep = L.currentStep;
    L.currentStep = Math.min(R.currentStep, L.sub-1);
    R.currentStep = Math.min(tmpStep, R.sub-1);
    
    refreshClocks();
    realignNextBeat();
  };

  playBtn.onclick=()=>{ running ? pause() : start(); };
  resetBtn.onclick=reset;

  // ===== init =====
  function init(){
    L.sub = 4;
    R.sub = 3;
    L.currentStep = 0;
    R.currentStep = 0;
    
    refreshClocks();
    setState("就绪");
  }
  init();
})();
