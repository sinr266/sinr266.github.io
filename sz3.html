<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节奏卡片练习 + 节拍器</title>
<style>
:root {
  --bg: #0f131f;
  --card-bg: #1a1f2e;
  --border: #2a324f;
  --text: #e2e7f2;
  --accent: #4a6fff;
  --muted: #6b7a9f;
  --green: #4CAF50;
  --orange: #FF9800;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 15px;
  margin: 0 auto;
  min-width: 320px;
  line-height: 1.5;
}

header {
  margin-bottom: 15px;
  text-align: center;
  position: relative;
}

h1 {
  font-size: 22px;
  margin-bottom: 8px;
  color: var(--text);
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

.home-link {
  position: absolute;
  left: 15px;
  top: 0;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: var(--card-bg);
  border-radius: 50%;
  border: 1px solid var(--border);
  transition: all 0.3s ease;
}

.home-link:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(1.05);
}

.home-link svg {
  width: 18px;
  height: 18px;
  fill: var(--text);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 1px;
  margin-bottom: 15px;
  background: var(--card-bg);
  padding: 1px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-width: 150px;
}

.control-group label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

.card-count-control {
  display: flex;
  align-items: center;
  gap: 10px;
}

#cardCount {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  outline: none;
  -webkit-appearance: none;
}

#cardCount::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.8);
}

#cardCount::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 50%;
}

#countDisplay {
  font-size: 13px;
  color: var(--accent);
  min-width: 40px;
  text-align: center;
  font-weight: 600;
}

.select-wrapper {
  position: relative;
  width: 100%;
}

#difficultySelect, #cardType {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 35px 8px 12px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  outline: none;
  transition: border-color 0.2s;
}

#difficultySelect:focus, #cardType:focus {
  border-color: var(--accent);
}

.select-wrapper::after {
  content: "▼";
  font-size: 10px;
  color: var(--muted);
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}

#difficultySelect option, #cardType option {
  background: var(--card-bg);
  color: var(--text);
  padding: 8px;
  font-size: 13px;
}

#difficultySelect option.mix-ultimate {
  color: var(--orange) !important;
  font-weight: 600 !important;
}

.quiz-btn {
  background: var(--accent);
  border: none;
  border-radius: 6px;
  padding: 10px 20px;
  color: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  width: 100%;
  margin-top: 5px;
}

.quiz-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

/* 卡片展示区 */
.cards-display {
  width: 100%;
  margin-bottom: 15px;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  padding: 10px;
}

.cards-container {
  display: flex;
  flex-wrap: wrap;
  gap: 0px;
  justify-content: center;
  min-width: min-content;
}

.card-slot {
  width: 240px;
  height: 400px;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--card-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.card-slot:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.card-slot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 20px;
}

.card-fallback {
  display: none;
  font-size: 24px;
  font-weight: 600;
  color: var(--accent);
  text-align: center;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  font-family: monospace;
}

.card-info {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 15px;
  min-height: 80px;
  margin-bottom: 15px;
}

.info-placeholder {
  color: var(--muted);
  text-align: center;
  font-style: italic;
  line-height: 1.5;
  padding: 10px 0;
  font-size: 14px;
}

.card-details {
  display: none;
}

.card-details.active {
  display: block;
}

.card-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--accent);
}

.card-pattern {
  font-family: monospace;
  font-size: 14px;
  margin-bottom: 10px;
  color: var(--text);
  background: rgba(255,255,255,0.05);
  padding: 4px 8px;
  border-radius: 4px;
  display: inline-block;
}

.card-desc {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}

/* ===== 节拍器部分样式 ===== */
.metronome-section {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 11px;
}

.metronome-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 0px;
  color: var(--accent);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.metronome-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  margin-bottom: 1px;
}

@media (max-width: 768px) {
  .metronome-controls {
    grid-template-columns: 1fr;
  }
}

.control-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.control-label {
  font-size: 13px;
  color: var(--muted);
  min-width: 60px;
}

.bpm-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bpm-input {
  width: 70px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
  color: var(--text);
  font-size: 14px;
  text-align: center;
  outline: none;
}

.bpm-input:focus {
  border-color: var(--accent);
}

.bpm-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}

.bpm-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: var(--accent);
}

.playback-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.play-btn {
  background: var(--accent);
  border: none;
  border-radius: 6px;
  padding: 8px 20px;
  color: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 100px;
}

.play-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.play-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.reset-btn, .big-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.reset-btn:hover, .big-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: var(--accent);
}

.big-btn.active {
  background: rgba(74, 111, 255, 0.2);
  border-color: var(--accent);
  color: var(--accent);
}

/* 网格显示区域 */
.grid-display {
  margin-bottom: 15px;
  overflow: hidden;
}

.canvas-container {
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  background: rgba(0,0,0,0.2);
}

#gridCanvas, #jpCanvas {
  width: 100%;
  height: auto;
  display: block;
}

/* 节拍器状态显示 */
.metro-status {
  font-size: 13px;
  color: var(--muted);
  padding: 4px 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 4px;
}

/* Beat信息显示 */
.beat-info {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--muted);
}

.beat-count {
  background: rgba(255,255,255,0.05);
  padding: 2px 8px;
  border-radius: 4px;
}

/* 大字显示 */
.big-beat {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  z-index: 1000;
}

.big-beat-text {
  font-size: 300px;
  font-weight: 1000;
  color: rgba(233, 236, 243, 0.18);
  text-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  letter-spacing: 2px;
}

/* 响应式设计 */
@media (max-width: 1200px) {
  .card-slot {
    width: 200px;
    height: 333px;
  }
}

@media (max-width: 768px) {
  .controls {
    flex-direction: column;
  }
  
  .control-group {
    min-width: 100%;
  }
  
  .card-slot {
   /* width: 180px; 暂时不要*/
    height: 300px;
  }
}

@media (max-width: 480px) {
  body {
    padding: 10px;
  }
  
  h1 {
    font-size: 18px;
  }
  
  .card-slot {
    width: 160px;
    height: 267px;
    min-width: 160px;
  }
  
  .cards-display {
    padding: 8px;
  }
  
  .cards-container {
    gap: 10px;
  }
  
  .card-slot img {
    padding: 15px;
  }
}

@media (max-width: 360px) {
  .cards-container {
    justify-content: flex-start;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 5px;
  }
  
  .card-slot {
    width: 140px;
    height: 233px;
    flex-shrink: 0;
  }
}

@-moz-document url-prefix() {
  #difficultySelect, #cardType {
    color: var(--text);
    background-color: rgba(255,255,255,0.05);
  }
  
  #difficultySelect option, #cardType option {
    color: var(--text);
    background-color: var(--card-bg);
  }
}
</style>
</head>

  <div class="control-group">

</div>

<div class="cards-display">

  </div>
</div>

<div class="card-info">

</div>

  </div>
  
  <div class="metronome-controls">
    <div class="control-row">
      <span class="control-label">BPM:</span>

      </div>
    </div>
    
    <div class="playback-controls">
      <button class="play-btn" id="playBtn">

        <span id="playText">播放</span>

      <button class="reset-btn" id="resetBtn">
        <svg viewBox="0 0 24 24" width="16" height="16">

        </svg>
        复位
      </button>
      <!-- 大字按钮 -->
      <button class="big-btn" id="bigBtn">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M4 19h4l2-6h4l2 6h4L14 5h-4L4 19zm7.3-9L12 7.7 12.7 10h-1.4z"></path>
        </svg>
        大字
      </button>
    </div>
  </div>
  
  <!-- Beat信息显示 -->
  <div class="beat-info">
    <span>当前设置：</span>
    <span class="beat-count" id="beatCount">4 beats</span>
    <span class="beat-count" id="subdivInfo">4 细分</span>
  </div>
  
  <!-- 节奏网格 -->
  <div class="grid-display">
    <div class="canvas-container">
      <canvas id="gridCanvas" width="980" height="520"></canvas>
    </div>
  </div>
  
  <!-- 简谱显示 -->

    <div class="canvas-container">

    </div>
  </div>
</div>

<!-- 大字显示 -->
<div class="big-beat" id="bigBeat">

</div>

// ===== 核心功能：根据卡片设置节拍器 =====
function syncMetronomeToCards(cards) {
  if (!cards || cards.length === 0) return;
  
  // 1. 设置节拍器 beat 数为卡片数量
  metroState.beats = cards.length;
  beatCount.textContent = `${cards.length} beats`;
  
  // 2. 重置节拍器状态
  metroState.subdiv = [];
  metroState.pattern = [];
  metroState.currentBeat = 0;
  metroState.currentSub = 0;
  metroState.flashUntil = 0;
  metroState.playingBeat = 0;
  metroState.playingSub = 0;
  
  // 3. 根据每张卡片的 pattern 设置细分和音色
  let hasThreeSubdiv = false;
  let hasFourSubdiv = false;
  
  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    const pattern = card.pattern; // 如 "1000", "1030", "100", "123" 等
    
    // 根据卡片ID的第一个数字确定细分数
    // 卡片ID格式: "41000" (4细分) 或 "3100" (3细分)
    // pattern长度可以判断: 4位是4细分, 3位是3细分
    const subdivCount = pattern.length; // 3 或 4
    
    // 记录细分类型
    if (subdivCount === 3) hasThreeSubdiv = true;
    if (subdivCount === 4) hasFourSubdiv = true;
    
    metroState.subdiv[i] = subdivCount;
    
    // 解析pattern中的每个字符，设置音色
    const beatPattern = [];
    for (let j = 0; j < subdivCount; j++) {
      const char = pattern[j];
      if (char === '1') {
        // 第一个beat的第一个位置是"强"，其他beat的第一个位置是"中强"
        if (j === 0) {
          beatPattern.push(i === 0 ? "强" : "中强");
        } else {
          beatPattern.push("弱");
        }
      } else if (char === '2' || char === '3' || char === '4') {
        // 数字2-4也作为有声音处理
        beatPattern.push("弱");
      } else {
        // '0' 或其他字符为静音
        beatPattern.push("静音");
      }
    }
    
    metroState.pattern[i] = beatPattern;
  }
  
  // 更新细分信息显示
  if (hasThreeSubdiv && hasFourSubdiv) {
    subdivInfo.textContent = "3/4 混合";
  } else if (hasThreeSubdiv) {
    subdivInfo.textContent = "3 细分";
  } else {
    subdivInfo.textContent = "4 细分";
  }
  
  // 4. 停止当前播放
  pauseMetronome();
  
  // 5. 重新绘制界面
  drawGrid();
  drawJp();
  
  // 6. 更新状态
  metroStatus.textContent = "已同步";
}

// ===== 节拍器绘制函数 =====
function drawGrid() {
  const W = gridCanvas.width, H = gridCanvas.height;
  gridCtx.clearRect(0, 0, W, H);
  
  // 背景
  const grad = gridCtx.createRadialGradient(W*0.35, H*0.2, 20, W*0.5, H*0.6, W);
  grad.addColorStop(0, "#0e1426");
  grad.addColorStop(1, "#070a12");
  gridCtx.fillStyle = grad;
  gridCtx.fillRect(0, 0, W, H);
  
  const marginL = 70, marginR = 30, marginT = 56, marginB = 54;
  const usableW = W - marginL - marginR;
  const usableH = H - marginT - marginB;
  const colW = Math.max(56, Math.min(96, Math.floor(usableW / Math.max(1, metroState.beats))));
  const gridW = metroState.beats * colW;
  const maxN = Math.max(...metroState.subdiv, 1);
  const refCellH = Math.max(46, Math.min(78, Math.floor(usableH / Math.max(1, maxN))));
  const gridH = Math.max(maxN * refCellH, refCellH * 4);
  const left = marginL + Math.max(0, Math.floor((usableW - gridW) / 2));
  const top = marginT + Math.max(0, Math.floor((usableH - gridH) / 2));
  
  // 绘制列分隔线
  gridCtx.strokeStyle = "rgba(255,255,255,.14)";
  gridCtx.lineWidth = 2.2;
  for (let b = 0; b < metroState.beats; b++) {
    const cx = left + b * colW + colW / 2;
    gridCtx.beginPath();
    gridCtx.moveTo(cx, top);
    gridCtx.lineTo(cx, top + gridH);
    gridCtx.stroke();
  }
  
  // 绘制每个格子
  for (let b = 0; b < metroState.beats; b++) {
    const n = metroState.subdiv[b];
    const cx = left + b * colW + colW / 2;
    
    // 计算每个细分位置
    for (let s = 0; s < n; s++) {
      const y0 = top + (s / n) * gridH;
      const segH = gridH / n;
      const iconY = y0 + Math.min(18, Math.max(12, segH * 0.28));
      const acc = metroState.pattern[b] ? metroState.pattern[b][s] : "静音";
      // 修改：显示当前正在播放的格子，而不是下一个
      const active = (metroState.playingBeat === b && 
                     metroState.playingSub === s && 
                     performance.now() < metroState.flashUntil);
      
      // 绘制音色图标
      drawAccentIcon(cx, iconY, acc, active);
    }
  }
}

function drawAccentIcon(cx, cy, name, active) {
  gridCtx.save();
  gridCtx.lineWidth = active ? 3 : 1.8;
  
  if (active) {
    gridCtx.globalAlpha = 0.18;
    gridCtx.fillStyle = "rgba(77,163,255,0.85)";
    gridCtx.beginPath();
    gridCtx.arc(cx, cy, 20, 0, Math.PI * 2);
    gridCtx.fill();
    gridCtx.globalAlpha = 1;
  }
  
  gridCtx.strokeStyle = "#ffffff";
  gridCtx.fillStyle = (active && name !== "静音") ? "#ffffff" : "transparent";
  const r = 11;
  
  if (name === "强") {
    // 正方形
    drawRoundedRect(cx - r, cy - r, r * 2, r * 2, 3);
  } else if (name === "中强") {
    // 三角形
    gridCtx.beginPath();
    gridCtx.moveTo(cx, cy - r);
    gridCtx.lineTo(cx - r, cy + r);
    gridCtx.lineTo(cx + r, cy + r);
    gridCtx.closePath();
    gridCtx.stroke();
    if (active) gridCtx.fill();
  } else if (name === "弱") {
    // 圆形
    gridCtx.beginPath();
    gridCtx.arc(cx, cy, r, 0, Math.PI * 2);
    gridCtx.stroke();
    if (active) gridCtx.fill();
  } else {
    // 静音（带斜线的圆）
    gridCtx.beginPath();
    gridCtx.arc(cx, cy, r, 0, Math.PI * 2);
    gridCtx.stroke();
    gridCtx.beginPath();
    gridCtx.moveTo(cx - r, cy + r);
    gridCtx.lineTo(cx + r, cy - r);
    gridCtx.stroke();
  }
  gridCtx.restore();
}

function drawRoundedRect(x, y, w, h, r) {
  gridCtx.beginPath();
  gridCtx.moveTo(x + r, y);
  gridCtx.arcTo(x + w, y, x + w, y + h, r);
  gridCtx.arcTo(x + w, y + h, x, y + h, r);
  gridCtx.arcTo(x, y + h, x, y, r);
  gridCtx.arcTo(x, y, x + w, y, r);
  gridCtx.closePath();
  gridCtx.stroke();
}

// 绘制简谱
function drawJp() {
  const W = jpCanvas.width, H = jpCanvas.height;
  jpCtx.clearRect(0, 0, W, H);
  
  // 背景
  const grad = jpCtx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#0b1020");
  grad.addColorStop(1, "#070a12");
  jpCtx.fillStyle = grad;
  jpCtx.fillRect(0, 0, W, H);
  
  jpCtx.strokeStyle = "rgba(255,255,255,.10)";
  jpCtx.lineWidth = 2;
  jpCtx.strokeRect(10, 10, W - 20, H - 20);
  
  const left = 18, right = W - 18;
  const beatW = (right - left) / metroState.beats;
  const yX = 96; // 符号显示位置
  
  // 绘制列分隔线
  jpCtx.strokeStyle = "rgba(255,255,255,.08)";
  jpCtx.lineWidth = 2;
  for (let b = 0; b <= metroState.beats; b++) {
    const x = left + b * beatW;
    jpCtx.beginPath();
    jpCtx.moveTo(x, 18);
    jpCtx.lineTo(x, H - 18);
    jpCtx.stroke();
  }
  
  // 绘制指针 - 修改：指向当前正在播放的位置
  const bpm = metroState.bpm;
  const t = (bpm - 40) / (250 - 40);
  const r = Math.round(30 + t * (220 - 30));
  const g2 = Math.round(200 + t * (60 - 200));
  const b = Math.round(80 + t * (60 - 80));
  const pointerColor = `rgb(${r},${g2},${b})`;
  
  const px = (() => {
    const beat = metroState.playingBeat;
    const n = metroState.subdiv[beat] || 4;
    const sub = metroState.playingSub;
    const effN = n === 1 ? 2 : n;
    return left + beat * beatW + (sub + 0.5) * (beatW / (effN === 1 ? 2 : effN));
  })();
  
  jpCtx.save();
  jpCtx.globalAlpha = 0.22;
  jpCtx.strokeStyle = pointerColor;
  jpCtx.lineWidth = 10;
  jpCtx.beginPath();
  jpCtx.moveTo(px, 22);
  jpCtx.lineTo(px, H - 22);
  jpCtx.stroke();
  jpCtx.restore();
  
  jpCtx.strokeStyle = pointerColor;
  jpCtx.lineWidth = 4;
  jpCtx.beginPath();
  jpCtx.moveTo(px, 18);
  jpCtx.lineTo(px, H - 18);
  jpCtx.stroke();
  
  // 绘制每个位置的符号
  for (let beat = 0; beat < metroState.beats; beat++) {
  const n = metroState.subdiv[beat] || 4;
  const x1 = left + beat * beatW;
  const effN = n === 1 ? 2 : n;
  const slotsToDraw = n === 1 ? 1 : n;
  
  for (let s = 0; s < slotsToDraw; s++) {
    const x = x1 + (s + 0.5) * (beatW / effN);
    const acc = metroState.pattern[beat] ? metroState.pattern[beat][s] : "静音";
    
    // 绘制圆形
    const radius = 8;
    
    if (acc === "静音") {
      // 静音：空心灰圆
      jpCtx.strokeStyle = "#888888";
      jpCtx.lineWidth = 1.5;
      jpCtx.beginPath();
      jpCtx.arc(x, yX, radius, 0, Math.PI * 2);
      jpCtx.stroke();
    } else {
      // 有声音：彩色实心圆
      if (acc === "强") {
        jpCtx.fillStyle = "#FF9800";
      } else if (acc === "中强") {
        jpCtx.fillStyle = "#FF9800";
      } else {
        jpCtx.fillStyle = "#FF9800";
      }
      
      jpCtx.beginPath();
      jpCtx.arc(x, yX, radius, 0, Math.PI * 2);
      jpCtx.fill();
    }
    
    if (acc === "强") {
      jpCtx.fillStyle = "#4a6fff";
      jpCtx.font = "18px ui-monospace, monospace";
      jpCtx.fillText(">", x, 58);
      }
    }
  }
}

// 音频相关
function ensureAudio() {
  if (!metroState.audioContext) {
    metroState.audioContext = new (window.AudioContext || window.webkitAudioContext)({latencyHint: "interactive"});
  }
}

function makeClickBuffer(freq, ms) {
  if (freq <= 0 || ms <= 0) return null;
  ensureAudio();
  const sr = metroState.audioContext.sampleRate;
  const n = Math.max(1, Math.floor(sr * (ms / 1000)));
  const buf = metroState.audioContext.createBuffer(1, n, sr);
  const d = buf.getChannelData(0);
  const attack = Math.max(1, Math.floor(0.002 * sr));
  const decay = Math.max(1, Math.floor(0.020 * sr));
  const dEnd = Math.min(decay, n);
  const w = 2 * Math.PI * freq / sr;
  let ph = 0;
  for (let i = 0; i < n; i++) {
    let env;
    if (i < attack) env = i / attack;
    else {
      const tt = (i - attack) / Math.max(1, (dEnd - attack));
      env = (i < dEnd) ? Math.exp(-6 * tt) : 0;
    }
    d[i] = Math.sin(ph) * env * 0.45;
    ph += w;
  }
  return buf;
}

function playClick(freq, ms, time) {
  if (freq <= 0 || ms <= 0 || !metroState.running) return;
  ensureAudio();
  const buf = makeClickBuffer(freq, ms);
  if (!buf) return;
  const src = metroState.audioContext.createBufferSource();
  src.buffer = buf;
  src.connect(metroState.audioContext.destination);
  src.start(time);
}

    bigBtn.innerHTML = `
      <svg viewBox="0 0 24 24" width="16" height="16">
        <path d="M4 19h4l2-6h4l2 6h4L14 5h-4L4 19zm7.3-9L12 7.7 12.7 10h-1.4z"></path>
      </svg>
      大字开
    `;
  } else {
    bigBtn.classList.remove('active');
    bigBtn.innerHTML = `
      <svg viewBox="0 0 24 24" width="16" height="16">
        <path d="M4 19h4l2-6h4l2 6h4L14 5h-4L4 19zm7.3-9L12 7.7 12.7 10h-1.4z"></path>
      </svg>
      大字
    `;
    hideBigBeat();
  }
}

function showBigBeat(beatNumber) {
  if (!bigBeatMode) return;
  
  // beatNumber是从0开始的，显示时加1
  const displayNumber = beatNumber + 1;
  bigBeatText.textContent = displayNumber;
  bigBeat.style.display = 'flex';
  
  // 500ms后自动隐藏
  setTimeout(() => {
    hideBigBeat();
  }, 500);
}

function hideBigBeat() {
  bigBeat.style.display = 'none';
}

// 播放控制 - 关键修改部分
function playMetronome() {
  ensureAudio();
  if (metroState.running) return;
  
  metroState.running = true;
  metroState.beatStartTime = metroState.audioContext.currentTime;
  metroState.nextTickTime = metroState.beatStartTime;
  
  updatePlayButton(true);
  metroStatus.textContent = "播放中";
  
  scheduleNextTick();
}

function pauseMetronome() {
  if (!metroState.running) return;
  metroState.running = false;
  if (metroState.timer) {
    clearTimeout(metroState.timer);
    metroState.timer = null;
  }
  updatePlayButton(false);
  metroStatus.textContent = "已暂停";
  hideBigBeat();
}

function resetMetronome() {
  pauseMetronome();
  metroState.currentBeat = 0;
  metroState.currentSub = 0;
  metroState.playingBeat = 0;
  metroState.playingSub = 0;
  metroState.flashUntil = 0;
  hideBigBeat();
  drawGrid();
  drawJp();
  metroStatus.textContent = "就绪";
}

function scheduleNextTick() {
  if (!metroState.running) return;
  
  const now = metroState.audioContext.currentTime;
  const lookAhead = 0.12; // 稍微增加前瞻时间
  
  while (metroState.nextTickTime < now + lookAhead) {
    const b = metroState.currentBeat;
    const s = metroState.currentSub;
    const acc = (metroState.pattern[b] && metroState.pattern[b][s]) ? metroState.pattern[b][s] : "静音";
    const n = metroState.subdiv[b] || 4;
    
    // === 关键修改：先播放声音 ===
    // 播放节拍器声音（每拍第一个细分）
    if (s === 0) {
      playClick(metroSound.freq, metroSound.ms, metroState.nextTickTime);
    }
    
    // 播放格子声音
    if (acc !== "静音") {
      const cfg = sounds[acc] || {freq: 0, ms: 0};
      playClick(cfg.freq, cfg.ms, metroState.nextTickTime);
    }
    
    // === 关键修改：声音播放后立即更新当前播放位置 ===
    const visualDelay = Math.max(0, metroState.nextTickTime - now);
    
    // 立即设置当前播放位置（声音开始播放时）
    setTimeout(() => {
      // 更新当前播放位置
      metroState.playingBeat = b;
      metroState.playingSub = s;
      metroState.flashUntil = performance.now() + 80; // 稍微延长高亮时间
      
      // 如果是每拍的第一个细分，显示大字
      if (s === 0) {
        showBigBeat(b);
      }
      
      // 更新显示
      drawGrid();
      drawJp();
    }, visualDelay * 1000);
    
    // === 关键修改：延迟更新下一位置 ===
    const advanceDelay = visualDelay * 1000 + 5; // 5ms后更新到下一位置
    
    setTimeout(() => {
      // 计算下一个位置
      let nextBeat = b;
      let nextSub = s + 1;
      
      if (nextSub >= n) {
        nextSub = 0;
        nextBeat = (nextBeat + 1) % metroState.beats;
        if (nextBeat === 0) {
          metroState.beatStartTime = metroState.nextTickTime;
        }
      }
      
      // 更新到下一个位置
      metroState.currentBeat = nextBeat;
      metroState.currentSub = nextSub;
    }, advanceDelay);
    
    // 计算下一个时间点
    const beatSec = 60 / metroState.bpm;
    metroState.nextTickTime += beatSec / n;
  }
  
  metroState.timer = setTimeout(scheduleNextTick, 16);
}

function updatePlayButton(isPlaying) {
  if (isPlaying) {
    playIcon.innerHTML = '<path d="M7 6h4v12H7zM13 6h4v12h-4z"/>';
    playText.textContent = "暂停";
    playBtn.style.background = "#FF9800";
  } else {
    playIcon.innerHTML = '<path d="M8 5v14l12-7z"/>';
    playText.textContent = "播放";
    playBtn.style.background = "var(--accent)";
  }
}

function setBpm(value) {
  const clamped = Math.max(40, Math.min(250, parseInt(value) || 60));
  metroState.bpm = clamped;
  bpmInput.value = clamped;
}

// ===== 卡片部分函数 =====
function updateDifficultyOptions() {
  difficultySelect.innerHTML = '';
  const difficulties = difficultyDescriptions[cardState.currentType];
  difficulties.forEach(diff => {
    const option = document.createElement('option');
    option.value = diff.level;
    option.textContent = `难度${diff.level}: ${diff.name}`;
    if (cardState.currentType === 'mix') {
      option.classList.add('mix-ultimate');
    }
    if (diff.level === cardState.currentDifficulty) {
      option.selected = true;
    }
    difficultySelect.appendChild(option);
  });
}

function createCard(card, index) {
  const slot = document.createElement('div');
  slot.className = 'card-slot';
  slot.dataset.index = index;
  const img = document.createElement('img');
  img.src = `${card.id}.svg`;
  img.alt = card.id;
  img.onerror = function() {
    this.style.display = 'none';
    const fallback = document.createElement('div');
    fallback.className = 'card-fallback';
    fallback.textContent = card.id;
    fallback.style.display = 'flex';
    slot.appendChild(fallback);
  };
  slot.appendChild(img);
  slot.addEventListener('click', () => showCardDetails(index));
  return slot;
}

function updateCardsDisplay() {
  const count = parseInt(cardCount.value);
  countDisplay.textContent = `${count} 张`;
  cardsContainer.innerHTML = '';
  const key = `${cardState.currentType}_${cardState.currentDifficulty}`;
  const pool = cardsByDifficulty[key] || [];
  if (pool.length === 0) {
    cardsContainer.innerHTML = '<div style="color:var(--muted); text-align:center; padding:40px;">暂无卡片数据</div>';
    cardState.currentCards = [];
    return;
  }
  cardState.currentCards = [];
  for (let i = 0; i < count; i++) {
    const randomIndex = Math.floor(Math.random() * pool.length);
    const card = pool[randomIndex];
    cardState.currentCards.push(card);
  }
  cardState.currentCards.forEach((card, index) => {
    const cardElement = createCard(card, index);
    cardsContainer.appendChild(cardElement);
  });
  infoPlaceholder.style.display = 'block';
  cardDetails.classList.remove('active');
  cardState.selectedCard = null;
  
  // ===== 关键：出题后同步节拍器设置 =====
  syncMetronomeToCards(cardState.currentCards);
}

function showCardDetails(index) {
  if (index < 0 || index >= cardState.currentCards.length) return;
  const card = cardState.currentCards[index];
  cardState.selectedCard = card;
  detailName.textContent = card.name;
  detailPattern.textContent = `节奏型: ${card.pattern}`;
  detailDesc.textContent = card.desc;
  infoPlaceholder.style.display = 'none';
  cardDetails.classList.add('active');
}

function generateQuiz() {
  cardState.currentType = cardType.value;
  cardState.currentDifficulty = parseInt(difficultySelect.value);
  updateCardsDisplay();
  infoPlaceholder.style.display = 'block';
  cardDetails.classList.remove('active');
  cardState.selectedCard = null;
}

function initCards() {
  updateDifficultyOptions();
  generateQuiz();
}

// ===== 事件监听 =====
// 卡片部分事件监听
cardCount.addEventListener('input', () => {
  countDisplay.textContent = `${cardCount.value} 张`;
});

cardType.addEventListener('change', () => {
  cardState.currentType = cardType.value;
  cardState.currentDifficulty = 1;
  updateDifficultyOptions();
});

difficultySelect.addEventListener('change', () => {
  cardState.currentDifficulty = parseInt(difficultySelect.value);
});

startQuizBtn.addEventListener('click', generateQuiz);

// 节拍器部分事件监听
bpmMinus.addEventListener('click', () => {
  setBpm(metroState.bpm - 1);
  if (metroState.running) {
    pauseMetronome();
    playMetronome();
  }
});

bpmPlus.addEventListener('click', () => {
  setBpm(metroState.bpm + 1);
  if (metroState.running) {
    pauseMetronome();
    playMetronome();
  }
});

bpmInput.addEventListener('change', () => {
  setBpm(bpmInput.value);
  if (metroState.running) {
    pauseMetronome();
    playMetronome();
  }
});

playBtn.addEventListener('click', () => {
  if (metroState.running) {
    pauseMetronome();
  } else {
    playMetronome();
  }
});

resetBtn.addEventListener('click', resetMetronome);

// 大字按钮事件监听
bigBtn.addEventListener('click', toggleBigBeatMode);

// ===== 初始化 =====
function init() {
  // 初始化卡片部分
  initCards();
  
  // 初始化节拍器部分
  setBpm(60);
  // 初始化为4beat，4细分
  metroState.beats = 4;
  metroState.subdiv = [4, 4, 4, 4];
  metroState.pattern = [
    ["强", "弱", "弱", "弱"],
    ["中强", "弱", "弱", "弱"],
    ["中强", "弱", "弱", "弱"],
    ["中强", "弱", "弱", "弱"]
  ];
  
  beatCount.textContent = "4 beats";
  subdivInfo.textContent = "4 细分";
  
  // 初始化大字模式
  bigBeatMode = false;
  bigBeat.style.display = 'none';
  
  drawGrid();
  drawJp();
  
  // 添加键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      if (metroState.running) {
        pauseMetronome();
      } else {
        playMetronome();
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      generateQuiz();
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      resetMetronome();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      setBpm(metroState.bpm - (e.shiftKey ? 5 : 1));
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      setBpm(metroState.bpm + (e.shiftKey ? 5 : 1));
    } else if (e.key === 'b' || e.key === 'B') {
      e.preventDefault();
      toggleBigBeatMode();
    }
  });
}

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
