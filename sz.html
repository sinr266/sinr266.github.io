<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>节奏卡片练习 + 节拍器</title>

<style>
:root{
  --bg:#0f131f;
  --card-bg:#1a1f2e;
  --border:#2a324f;
  --text:#e2e7f2;
  --accent:#4a6fff;
  --muted:#6b7a9f;
  --orange:#FF9800;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:14px;
  min-width:320px;
  line-height:1.5;
}

header{
  margin-bottom:12px;
  text-align:center;
  position:relative;
}
h1{font-size:20px;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:13px}

.home-link{
  position:absolute;left:10px;top:0;
  text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;
  background:var(--card-bg);
  border-radius:999px;
  border:1px solid var(--border);
  transition:all .2s ease;
}
.home-link:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.04)}
.home-link svg{width:18px;height:18px;fill:var(--text)}

/* ===== 顶部控制区（极简） ===== */
.controls{
  display:grid;
  grid-template-columns: 1.2fr 1fr 1fr 1.2fr;
  gap:10px;
  margin-bottom:12px;
  background:var(--card-bg);
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
}
@media (max-width: 900px){
  .controls{grid-template-columns:1fr 1fr}
}
@media (max-width: 520px){
  .controls{grid-template-columns:1fr}
}

.control-group{display:flex;flex-direction:column;gap:0px;min-width:0}
.control-group label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px}

.select-wrapper{position:relative;width:100%}
select{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 34px 10px 12px;
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  outline:none;
  appearance:none;
}
select:focus{border-color:var(--accent)}
.select-wrapper::after{
  content:"▼";
  font-size:10px;
  color:var(--muted);
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
}
select option{background:var(--card-bg);color:var(--text);font-size:13px}
select option.mix-ultimate{color:var(--orange)!important;font-weight:700!important}

/* 卡片数量：- 4 + */
.stepper{
  display:flex;
  align-items:center;
  gap:10px;
}
.stepper-btn{
  width:38px;height:38px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.05);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  transition:all .15s ease;
  user-select:none;
}
.stepper-btn:hover{background:rgba(255,255,255,0.09);border-color:var(--accent)}
.stepper-value{
  flex:1;
  height:38px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  font-weight:800;
  color:var(--accent);
  letter-spacing:.5px;
}

/* 出题 + 播放 同一栏 */
.action-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.btn{
  border:none;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
  font-weight:750;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .15s ease;
  user-select:none;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.92;transform:translateY(-1px)}
.btn-ghost{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  color:var(--text);
}
.btn-ghost:hover{background:rgba(255,255,255,0.09);border-color:var(--accent)}
.btn svg{width:16px;height:16px;fill:currentColor}

/* ===== 卡片展示：永远4列，最多两行（4x2），无间隙，小于4居中 ===== */
.cards-display{
  width:100%;
  margin-bottom:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,0.02);
  padding:0;              /* 关键：无间隙 */
  overflow:hidden;
}

.cards-container{
  display:flex;
  flex-wrap:wrap;         /* 超过4张自动到第二行 */
  justify-content:center; /* 少于4张居中 */
  align-content:flex-start;
  gap:0;                  /* 关键：卡片之间无空隙 */
}

.card-slot{
  width:25%;                 /* 永远4列 */
  aspect-ratio: 55.2 / 90.1999; /* 按SVG真实比例，更舒服 */
  background:var(--card-bg);
  overflow:hidden;
  border:0;                  /* 不用border，避免“缝” */
  border-radius:0;           /* 避免边角露缝 */
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); /* 分隔线（不产生间隙） */
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.card-slot:hover{
  transform:translateY(-1px);
  box-shadow: inset 0 0 0 1px rgba(74,111,255,0.7), 0 10px 18px rgba(0,0,0,.25);
}

/* SVG图片：真正自适应 */
.card-slot img{
  width:100%;
  height:100%;
  display:block;         /* 去掉img底部空隙 */
  object-fit:contain;    /* 等比缩放，不变形 */
  object-position:center;
  padding:2%;             /* 最大化内容，确保竖屏也能塞下4张 */
  box-sizing:border-box;
}

.card-fallback{
  display:none;
  width:100%;height:100%;
  align-items:center;justify-content:center;
  font-size:18px;
  font-weight:900;
  color:var(--accent);
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

/* 播放时：当前 beat 的卡片闪烁（不靠border，靠inset阴影） */
.card-slot.beat-active{
  animation: beatFlash 160ms ease-out;
  box-shadow:
    inset 0 0 0 3px rgba(255,152,0,0.95),
    0 10px 20px rgba(0,0,0,0.25);
}

@keyframes beatFlash{
  0%   { filter: brightness(1.18); }
  100% { filter: brightness(1.03); }
}

/* ===== 信息区 ===== */
.card-info{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  min-height:72px;
}
.info-placeholder{
  color:var(--muted);
  text-align:center;
  font-style:italic;
  padding:6px 0;
  font-size:13px;
}
.card-details{display:none}
.card-details.active{display:block}
.card-name{font-size:15px;font-weight:900;margin-bottom:6px;color:var(--accent)}
.card-pattern{
  font-family:ui-monospace, monospace;
  font-size:13px;
  margin-bottom:8px;
  color:var(--text);
  background:rgba(255,255,255,0.05);
  padding:4px 8px;
  border-radius:10px;
  display:inline-block;
}
.card-desc{color:var(--muted);font-size:13px;line-height:1.4}

/* ===== 节拍器：默认折叠 ===== */
.metronome-shell{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
.metro-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 12px;
  cursor:pointer;
  user-select:none;
}
.metro-head-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.metro-title{
  font-size:15px;
  font-weight:900;
  color:var(--accent);
}
.metro-status{
  font-size:12px;
  color:var(--muted);
  padding:4px 8px;
  background:rgba(255,255,255,0.05);
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.06);
}
.chev{
  width:38px;height:38px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.05);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.chev svg{width:16px;height:16px;fill:var(--text)}
.metronome-shell.open .chev{transform:rotate(180deg);border-color:var(--accent);background:rgba(255,255,255,0.08)}

.metro-body{
  display:none;
  padding:12px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.metronome-shell.open .metro-body{display:block}

.metronome-controls{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}
@media (max-width: 768px){
  .metronome-controls{grid-template-columns:1fr}
}

.control-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.control-label{font-size:12px;color:var(--muted);min-width:56px;font-weight:700}

.bpm-control{display:flex;align-items:center;gap:8px}
.bpm-input{
  width:86px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px 10px;
  color:var(--text);
  font-size:14px;
  text-align:center;
  outline:none;
}
.bpm-input:focus{border-color:var(--accent)}
.bpm-btn{
  width:38px;height:38px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.05);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  transition:all .15s ease;
}
.bpm-btn:hover{background:rgba(255,255,255,0.09);border-color:var(--accent)}

.secondary-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small-btn{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 12px;
  color:var(--text);
  cursor:pointer;
  font-size:13px;
  font-weight:750;
  display:flex;align-items:center;gap:8px;
  transition:all .15s ease;
}
.small-btn:hover{background:rgba(255,255,255,0.09);border-color:var(--accent)}
.small-btn svg{width:16px;height:16px;fill:currentColor}
.small-btn.active{background:rgba(74,111,255,0.2);border-color:var(--accent);color:var(--accent)}

.beat-info{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:8px 0 10px;
  font-size:12px;
  color:var(--muted);
}
.badge{
  background:rgba(255,255,255,0.05);
  padding:2px 8px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.06);
}

.canvas-container{
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:rgba(0,0,0,0.18);
  margin-bottom:10px;
}
#gridCanvas,#jpCanvas{width:100%;height:auto;display:block}

/* 大字层 */
.big-beat{
  position:fixed;inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  z-index:1000;
}
.big-beat-text{
  font-size:min(42vw, 320px);
  font-weight:1000;
  color:rgba(255,255,255,0.3);
  text-shadow:0 10px 40px rgba(0,0,0,0.35);
  letter-spacing:2px;
  transform: translateY(-22vh);  
}
</style>
</head>

      <button class="stepper-btn" id="countMinus" aria-label="减少卡片数量">−</button>

      <button class="stepper-btn" id="countPlus" aria-label="增加卡片数量">+</button>

  </div>

  <div class="control-group">
    <label>卡片类型</label>

    </div>
  </div>

  <div class="control-group">

    <div class="select-wrapper">
      <select id="difficultySelect"></select>
    </div>
  </div>

  <div class="control-group">
    <label>操作</label>
    <div class="action-row">
      <button class="btn btn-primary" id="startQuiz">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2zm1 14.5h-2V10h2v6.5zm0-8h-2V6h2v2.5z"/></svg>
        出题
      </button>

      <button class="btn btn-ghost" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l12-7z"></path></svg>
        <span id="playText">播放</span>
      </button>
    </div>
  </div>
</div>

<!-- 卡片展示 -->
<div class="cards-display">
  <div class="cards-container" id="cardsContainer"></div>
</div>

<!-- 信息区 -->
<div class="card-info">

  <div id="cardDetails" class="card-details">
    <div class="card-name" id="detailName"></div>
    <div class="card-pattern" id="detailPattern"></div>
    <div class="card-desc" id="detailDesc"></div>
  </div>
</div>

<!-- 节拍器：默认折叠 -->
<div class="metronome-shell" id="metronomeShell">
  <div class="metro-head" id="metroToggle">
    <div class="metro-head-left">
      <div class="metro-title">节拍器</div>
      <span class="metro-status" id="metroStatus">就绪</span>
    </div>
    <div class="chev" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </div>
  </div>

  <div class="metro-body">
    <div class="metronome-controls">
      <div class="control-row">
        <span class="control-label">BPM</span>
        <div class="bpm-control">
          <button class="bpm-btn" id="bpmMinus">−</button>
          <input type="number" id="bpmInput" class="bpm-input" value="60" min="40" max="250">
          <button class="bpm-btn" id="bpmPlus">+</button>
        </div>
      </div>

      <div class="secondary-actions">
        <button class="small-btn" id="resetBtn">
          <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.65 9H3l3.5-3.5L10 14H7.42A5 5 0 1 0 12 7V5z"/></svg>
          复位
        </button>

        <button class="small-btn active" id="bigBtn">
          <svg viewBox="0 0 24 24"><path d="M4 19h4l2-6h4l2 6h4L14 5h-4L4 19zm7.3-9L12 7.7 12.7 10h-1.4z"/></svg>
          大字开
        </button>
      </div>
    </div>

    <div class="beat-info">
      <span>当前设置</span>
      <span class="badge" id="beatCount">4 beats</span>
      <span class="badge" id="subdivInfo">4 细分</span>
    </div>

    <div class="canvas-container">
      <canvas id="gridCanvas" width="980" height="520"></canvas>
    </div>

    <div class="canvas-container">
      <canvas id="jpCanvas" width="980" height="190"></canvas>
    </div>
  </div>
</div>

<!-- 大字显示 -->
<div class="big-beat" id="bigBeat">
  <div class="big-beat-text" id="bigBeatText">1</div>
</div>

function highlightCardBeat(beatIndex){
  const slots = cardsContainer.querySelectorAll(".card-slot");
  slots.forEach((el, i) => {
    if(i === beatIndex) el.classList.add("beat-active");
    else el.classList.remove("beat-active");
  });

  }, 160);

/* =========================
   卡片 -> 节拍器同步
   ========================= */
function syncMetronomeToCards(cards){
  if(!cards || cards.length === 0) return;

  metroState.beats = cards.length;
  beatCount.textContent = `${cards.length} beats`;

  metroState.subdiv = [];
  metroState.pattern = [];
  metroState.currentBeat = 0;
  metroState.currentSub = 0;
  metroState.flashUntil = 0;
  metroState.playingBeat = 0;
  metroState.playingSub = 0;

  let hasThree=false, hasFour=false;

  for(let i=0;i<cards.length;i++){
    const card = cards[i];
    const pattern = card.pattern;
    const subdivCount = pattern.length;

    if(subdivCount === 3) hasThree=true;
    if(subdivCount === 4) hasFour=true;

    metroState.subdiv[i] = subdivCount;

    const beatPattern = [];
    for(let j=0;j<subdivCount;j++){
      const ch = pattern[j];
      if(ch === "1"){
        if(j === 0) beatPattern.push(i===0 ? "强" : "中强");
        else beatPattern.push("弱");
      }else if(ch === "2" || ch === "3" || ch === "4"){
        beatPattern.push("弱");
      }else{
        beatPattern.push("静音");
      }
    }
    metroState.pattern[i] = beatPattern;
  }

  if(hasThree && hasFour) subdivInfo.textContent = "3/4 混合";
  else if(hasThree) subdivInfo.textContent = "3 细分";
  else subdivInfo.textContent = "4 细分";

  pauseMetronome();
  drawGrid();
  drawJp();
  metroStatus.textContent = "已同步";
}

/* =========================
   绘制
   ========================= */
function drawGrid(){
  const W=gridCanvas.width,H=gridCanvas.height;
  gridCtx.clearRect(0,0,W,H);

  const grad = gridCtx.createRadialGradient(W*0.35,H*0.2,20,W*0.5,H*0.6,W);
  grad.addColorStop(0,"#0e1426");
  grad.addColorStop(1,"#070a12");
  gridCtx.fillStyle=grad;
  gridCtx.fillRect(0,0,W,H);

  const marginL=70, marginR=30, marginT=56, marginB=54;
  const usableW=W-marginL-marginR;
  const usableH=H-marginT-marginB;
  const colW=Math.max(56, Math.min(96, Math.floor(usableW/Math.max(1, metroState.beats))));
  const gridW=metroState.beats*colW;
  const maxN=Math.max(...metroState.subdiv,1);
  const refCellH=Math.max(46, Math.min(78, Math.floor(usableH/Math.max(1,maxN))));
  const gridH=Math.max(maxN*refCellH, refCellH*4);
  const left=marginL + Math.max(0, Math.floor((usableW-gridW)/2));
  const top=marginT + Math.max(0, Math.floor((usableH-gridH)/2));

  gridCtx.strokeStyle="rgba(255,255,255,.14)";
  gridCtx.lineWidth=2.2;
  for(let b=0;b<metroState.beats;b++){
    const cx=left+b*colW+colW/2;
    gridCtx.beginPath();
    gridCtx.moveTo(cx, top);
    gridCtx.lineTo(cx, top+gridH);
    gridCtx.stroke();
  }

  for(let b=0;b<metroState.beats;b++){
    const n=metroState.subdiv[b] || 4;
    const cx=left+b*colW+colW/2;
    for(let s=0;s<n;s++){
      const y0=top+(s/n)*gridH;
      const segH=gridH/n;
      const iconY=y0+Math.min(18, Math.max(12, segH*0.28));
      const acc = (metroState.pattern[b] ? metroState.pattern[b][s] : "静音");
      const active = (metroState.playingBeat===b && metroState.playingSub===s && performance.now() < metroState.flashUntil);
      drawAccentIcon(cx, iconY, acc, active);
    }
  }
}
function drawAccentIcon(cx, cy, name, active){
  gridCtx.save();
  gridCtx.lineWidth = active ? 3 : 1.8;

  if(active){
    gridCtx.globalAlpha=0.18;
    gridCtx.fillStyle="rgba(77,163,255,0.85)";
    gridCtx.beginPath();
    gridCtx.arc(cx,cy,20,0,Math.PI*2);
    gridCtx.fill();
    gridCtx.globalAlpha=1;
  }

  gridCtx.strokeStyle="#ffffff";
  gridCtx.fillStyle = (active && name !== "静音") ? "#ffffff" : "transparent";
  const r=11;

  if(name==="强"){
    drawRoundedRect(cx-r, cy-r, r*2, r*2, 3);
  }else if(name==="中强"){
    gridCtx.beginPath();
    gridCtx.moveTo(cx, cy-r);
    gridCtx.lineTo(cx-r, cy+r);
    gridCtx.lineTo(cx+r, cy+r);
    gridCtx.closePath();
    gridCtx.stroke();
    if(active) gridCtx.fill();
  }else if(name==="弱"){
    gridCtx.beginPath();
    gridCtx.arc(cx,cy,r,0,Math.PI*2);
    gridCtx.stroke();
    if(active) gridCtx.fill();
  }else{
    gridCtx.beginPath();
    gridCtx.arc(cx,cy,r,0,Math.PI*2);
    gridCtx.stroke();
    gridCtx.beginPath();
    gridCtx.moveTo(cx-r, cy+r);
    gridCtx.lineTo(cx+r, cy-r);
    gridCtx.stroke();
  }
  gridCtx.restore();
}
function drawRoundedRect(x,y,w,h,r){
  gridCtx.beginPath();
  gridCtx.moveTo(x+r,y);
  gridCtx.arcTo(x+w,y,x+w,y+h,r);
  gridCtx.arcTo(x+w,y+h,x,y+h,r);
  gridCtx.arcTo(x,y+h,x,y,r);
  gridCtx.arcTo(x,y,x+w,y,r);
  gridCtx.closePath();
  gridCtx.stroke();
}

function drawJp(){
  const W=jpCanvas.width,H=jpCanvas.height;
  jpCtx.clearRect(0,0,W,H);

  const grad=jpCtx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#0b1020");
  grad.addColorStop(1,"#070a12");
  jpCtx.fillStyle=grad;
  jpCtx.fillRect(0,0,W,H);

  jpCtx.strokeStyle="rgba(255,255,255,.10)";
  jpCtx.lineWidth=2;
  jpCtx.strokeRect(10,10,W-20,H-20);

  const left=18, right=W-18;
  const beatW=(right-left)/metroState.beats;
  const yX=96;

  jpCtx.strokeStyle="rgba(255,255,255,.08)";
  jpCtx.lineWidth=2;
  for(let b=0;b<=metroState.beats;b++){
    const x=left+b*beatW;
    jpCtx.beginPath();
    jpCtx.moveTo(x,18);
    jpCtx.lineTo(x,H-18);
    jpCtx.stroke();
  }

  const bpm=metroState.bpm;
  const t=(bpm-40)/(250-40);
  const rr=Math.round(30+t*(220-30));
  const gg=Math.round(200+t*(60-200));
  const bb=Math.round(80+t*(60-80));
  const pointerColor=`rgb(${rr},${gg},${bb})`;

  const px = (() => {
    const beat = metroState.playingBeat;
    const n = metroState.subdiv[beat] || 4;
    const sub = metroState.playingSub;
    const effN = n === 1 ? 2 : n;
    return left + beat * beatW + (sub + 0.5) * (beatW / (effN === 1 ? 2 : effN));
  })();

  jpCtx.save();
  jpCtx.globalAlpha=0.22;
  jpCtx.strokeStyle=pointerColor;
  jpCtx.lineWidth=10;
  jpCtx.beginPath();
  jpCtx.moveTo(px,22);
  jpCtx.lineTo(px,H-22);
  jpCtx.stroke();
  jpCtx.restore();

  jpCtx.strokeStyle=pointerColor;
  jpCtx.lineWidth=4;
  jpCtx.beginPath();
  jpCtx.moveTo(px,18);
  jpCtx.lineTo(px,H-18);
  jpCtx.stroke();

  for(let beat=0; beat<metroState.beats; beat++){
    const n = metroState.subdiv[beat] || 4;
    const x1 = left + beat * beatW;
    const effN = n === 1 ? 2 : n;
    const slotsToDraw = n === 1 ? 1 : n;

    for(let s=0; s<slotsToDraw; s++){
      const x = x1 + (s + 0.5) * (beatW / effN);
      const acc = (metroState.pattern[beat] ? metroState.pattern[beat][s] : "静音");
      const radius = 8;

      if(acc === "静音"){
        jpCtx.strokeStyle="#888888";
        jpCtx.lineWidth=1.5;
        jpCtx.beginPath();
        jpCtx.arc(x,yX,radius,0,Math.PI*2);
        jpCtx.stroke();
      }else{
        jpCtx.fillStyle="#FF9800";
        jpCtx.beginPath();
        jpCtx.arc(x,yX,radius,0,Math.PI*2);
        jpCtx.fill();
      }

      if(acc === "强"){
        jpCtx.fillStyle="#4a6fff";
        jpCtx.font="18px ui-monospace, monospace";
        jpCtx.fillText(">", x, 58);
      }
    }
  }
}

/* =========================
   音频
   ========================= */
function ensureAudio(){
  if(!metroState.audioContext){
    metroState.audioContext = new (window.AudioContext || window.webkitAudioContext)({latencyHint:"interactive"});
  }
}
function makeClickBuffer(freq, ms){
  if(freq<=0 || ms<=0) return null;
  ensureAudio();
  const sr=metroState.audioContext.sampleRate;
  const n=Math.max(1, Math.floor(sr*(ms/1000)));
  const buf=metroState.audioContext.createBuffer(1,n,sr);
  const d=buf.getChannelData(0);
  const attack=Math.max(1, Math.floor(0.002*sr));
  const decay=Math.max(1, Math.floor(0.020*sr));
  const dEnd=Math.min(decay,n);
  const w=2*Math.PI*freq/sr;
  let ph=0;
  for(let i=0;i<n;i++){
    let env;
    if(i<attack) env=i/attack;
    else{
      const tt=(i-attack)/Math.max(1,(dEnd-attack));
      env=(i<dEnd)?Math.exp(-6*tt):0;
    }
    d[i]=Math.sin(ph)*env*0.45;
    ph+=w;
  }
  return buf;
}
function playClick(freq, ms, time){
  if(freq<=0 || ms<=0 || !metroState.running) return;
  ensureAudio();
  const buf=makeClickBuffer(freq, ms);
  if(!buf) return;
  const src=metroState.audioContext.createBufferSource();
  src.buffer=buf;
  src.connect(metroState.audioContext.destination);
  src.start(time);
}

    bigBtn.classList.remove("active");
    bigBtn.innerHTML = `
      <svg viewBox="0 0 24 24"><path d="M4 19h4l2-6h4l2 6h4L14 5h-4L4 19zm7.3-9L12 7.7 12.7 10h-1.4z"/></svg>
      大字
    `;
    hideBigBeat();
  }
}
function toggleBigBeatMode(){
  bigBeatMode = !bigBeatMode;
  setBigBtnUI();
}
function showBigBeat(beatNumber){
  if(!bigBeatMode) return;
  bigBeatText.textContent = (beatNumber + 1);
  bigBeat.style.display="flex";
  setTimeout(hideBigBeat, 500);
}
function hideBigBeat(){ bigBeat.style.display="none"; }

/* =========================
   播放控制
   ========================= */
function updatePlayButton(isPlaying){
  if(isPlaying){
    playIcon.innerHTML = '<path d="M7 6h4v12H7zM13 6h4v12h-4z"/>';
    playText.textContent="暂停";
    playBtn.style.background = "#FF9800";
    playBtn.style.borderColor = "transparent";
    playBtn.style.color = "#fff";
  }else{
    playIcon.innerHTML = '<path d="M8 5v14l12-7z"/>';
    playText.textContent="播放";
    playBtn.style.background = "rgba(255,255,255,0.05)";
    playBtn.style.borderColor = "var(--border)";
    playBtn.style.color = "var(--text)";
  }
}

function playMetronome(){
  ensureAudio();
  if(metroState.running) return;
  metroState.running=true;
  metroState.beatStartTime=metroState.audioContext.currentTime;
  metroState.nextTickTime=metroState.beatStartTime;
  updatePlayButton(true);
  metroStatus.textContent="播放中";
  scheduleNextTick();
}
function pauseMetronome(){
  if(!metroState.running) return;
  metroState.running=false;
  if(metroState.timer){
    clearTimeout(metroState.timer);
    metroState.timer=null;
  }
  updatePlayButton(false);
  metroStatus.textContent="已暂停";
  hideBigBeat();
}
function resetMetronome(){
  pauseMetronome();
  metroState.currentBeat=0;
  metroState.currentSub=0;
  metroState.playingBeat=0;
  metroState.playingSub=0;
  metroState.flashUntil=0;
  hideBigBeat();
  drawGrid();
  drawJp();
  metroStatus.textContent="就绪";
}

function scheduleNextTick(){
  if(!metroState.running) return;

  const now = metroState.audioContext.currentTime;
  const lookAhead = 0.12;

  while(metroState.nextTickTime < now + lookAhead){
    const b = metroState.currentBeat;
    const s = metroState.currentSub;
    const n = metroState.subdiv[b] || 4;
    const acc = (metroState.pattern[b] && metroState.pattern[b][s]) ? metroState.pattern[b][s] : "静音";

    if(s === 0){
      playClick(metroSound.freq, metroSound.ms, metroState.nextTickTime);
    }
    if(acc !== "静音"){
      const cfg = sounds[acc] || {freq:0, ms:0};
      playClick(cfg.freq, cfg.ms, metroState.nextTickTime);
    }

    const visualDelay = Math.max(0, metroState.nextTickTime - now);

    setTimeout(() => {
      metroState.playingBeat = b;
      metroState.playingSub = s;
      metroState.flashUntil = performance.now() + 90;

      // 卡片外框跟随 beat 闪烁
      if(s === 0) {
        highlightCardBeat(b);
        showBigBeat(b);
      }

      drawGrid();
      drawJp();
    }, visualDelay * 1000);

    setTimeout(() => {
      let nextBeat = b;
      let nextSub = s + 1;
      if(nextSub >= n){
        nextSub = 0;
        nextBeat = (nextBeat + 1) % metroState.beats;
        if(nextBeat === 0) metroState.beatStartTime = metroState.nextTickTime;
      }
      metroState.currentBeat = nextBeat;
      metroState.currentSub = nextSub;
    }, visualDelay * 1000 + 5);

    const beatSec = 60 / metroState.bpm;
    metroState.nextTickTime += beatSec / n;
  }

  metroState.timer = setTimeout(scheduleNextTick, 16);
}

function setBpm(value){
  const clamped = Math.max(40, Math.min(250, parseInt(value,10) || 60));
  metroState.bpm = clamped;
  bpmInput.value = clamped;
}

/* =========================
   卡片渲染
   ========================= */
function updateDifficultyOptions(){
  difficultySelect.innerHTML="";
  const diffs = difficultyDescriptions[cardState.currentType] || [];
  diffs.forEach(diff => {
    const opt = document.createElement("option");
    opt.value = diff.level;
    opt.textContent = `难度${diff.level}: ${diff.name}`;
    if(cardState.currentType === "mix") opt.classList.add("mix-ultimate");
    if(diff.level === cardState.currentDifficulty) opt.selected = true;
    difficultySelect.appendChild(opt);
  });
}

function createCard(card, index){
  const slot = document.createElement("div");
  slot.className="card-slot";
  slot.dataset.index=index;

  const img = document.createElement("img");
  img.src = `${card.id}.svg`;
  img.alt = card.id;
  img.onerror = function(){
    this.style.display="none";
    const fallback = document.createElement("div");
    fallback.className="card-fallback";
    fallback.textContent=card.id;
    fallback.style.display="flex";
    slot.appendChild(fallback);
  };

  slot.appendChild(img);
  slot.addEventListener("click", () => showCardDetails(index));
  return slot;
}

function updateCardsDisplay(){
  countDisplay.textContent = String(cardState.count);
  cardsContainer.innerHTML="";

  const key = `${cardState.currentType}_${cardState.currentDifficulty}`;
  const pool = cardsByDifficulty[key] || [];
  if(pool.length === 0){
    cardsContainer.innerHTML = `<div style="color:var(--muted);text-align:center;padding:28px;width:100%;">暂无卡片数据</div>`;
    cardState.currentCards=[];
    return;
  }

  cardState.currentCards = [];
  for(let i=0;i<cardState.count;i++){
    const randomIndex = Math.floor(Math.random()*pool.length);
    cardState.currentCards.push(pool[randomIndex]);
  }

  cardState.currentCards.forEach((card, idx) => {
    cardsContainer.appendChild(createCard(card, idx));
  });

  infoPlaceholder.style.display="block";
  cardDetails.classList.remove("active");
  cardState.selectedCard=null;

  syncMetronomeToCards(cardState.currentCards);
}

function showCardDetails(index){
  if(index < 0 || index >= cardState.currentCards.length) return;
  const card = cardState.currentCards[index];
  cardState.selectedCard = card;

  detailName.textContent = card.name;
  detailPattern.textContent = `节奏型: ${card.pattern}`;
  detailDesc.textContent = card.desc;

  infoPlaceholder.style.display="none";
  cardDetails.classList.add("active");
}

function generateQuiz(){
  cardState.currentType = cardType.value;
  cardState.currentDifficulty = parseInt(difficultySelect.value,10) || 1;
  updateCardsDisplay();
}

/* =========================
   事件绑定
   ========================= */
countMinus.addEventListener("click", () => {
  cardState.count = Math.max(1, cardState.count - 1);
  updateCardsDisplay();
});
countPlus.addEventListener("click", () => {
  cardState.count = Math.min(8, cardState.count + 1);
  updateCardsDisplay();
});

cardType.addEventListener("change", () => {
  cardState.currentType = cardType.value;
  cardState.currentDifficulty = 1;
  updateDifficultyOptions();
});

difficultySelect.addEventListener("change", () => {
  cardState.currentDifficulty = parseInt(difficultySelect.value,10) || 1;
});

startQuizBtn.addEventListener("click", generateQuiz);

playBtn.addEventListener("click", () => {
  if(metroState.running) pauseMetronome();
  else playMetronome();
});

bpmMinus.addEventListener("click", () => {
  setBpm(metroState.bpm - 1);
  if(metroState.running){ pauseMetronome(); playMetronome(); }
});
bpmPlus.addEventListener("click", () => {
  setBpm(metroState.bpm + 1);
  if(metroState.running){ pauseMetronome(); playMetronome(); }
});
bpmInput.addEventListener("change", () => {
  setBpm(bpmInput.value);
  if(metroState.running){ pauseMetronome(); playMetronome(); }
});
resetBtn.addEventListener("click", resetMetronome);
bigBtn.addEventListener("click", toggleBigBeatMode);

/* 节拍器折叠切换（默认折叠） */
metroToggle.addEventListener("click", () => {
  metronomeShell.classList.toggle("open");
});

/* =========================
   初始化
   ========================= */
function init(){
  // 默认：卡片4张、类型4、难度3
  cardState.count = 4;
  countDisplay.textContent = "4";

  updateDifficultyOptions();
  updateCardsDisplay();

  // 默认 BPM
  setBpm(60);

  // 大字默认开
  bigBeatMode = true;
  setBigBtnUI();
  bigBeat.style.display="none";

  // 节拍器内容默认折叠
  metronomeShell.classList.remove("open");

  drawGrid();
  drawJp();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
